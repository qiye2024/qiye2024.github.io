name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 8 * * 1" # Weekly: Monday 08:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "_scripts/update_scholar_citations.py"
      - "_scripts/test_scholar_citations.py"
      - "_plugins/google-scholar-citations.rb"
      - "_data/scholar_citations.yml"
      - ".github/workflows/update-scholar-citations.yml"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run citation parsing tests
        run: python -m unittest discover -s _scripts -p test_scholar_citations.py -v
      - name: Refresh citation counts
        if: github.event_name != 'pull_request'
        run: python _scripts/update_scholar_citations.py
      - name: Check for changed citation counts
        if: github.event_name != 'pull_request'
        id: changes
        run: |
          if git diff --quiet -- _data/scholar_citations.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit refreshed counts
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_citations.yml
          git commit -m "Update cached Google Scholar citation counts"
          git push
      # Pushes by GITHUB_TOKEN don't trigger other workflows, so request deployment.
      - name: Rebuild site with refreshed counts
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
